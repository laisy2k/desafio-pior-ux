<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="telaCadastro">

        <h1>Cadastro de usuário</h1>

        <p>Preencha os dados abaixo para continuar.</p>

        <form id="cadastroForm">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <button type="submit">Continuar</button> <button type="button" id="cancelar">Cancelar</button>

        </form>
    </div>

    <div id="telaSenha" style="display: none;">

        <h1>Quase terminando...</h1>

        <p>Agora crie uma senha.</p>

        <label for="senha">Senha:</label>
        <input type="password" id="senha">

        <button type="button" id="continuarSenha">Continuar</button>

    </div>

    <div id="telaConfirmacao" style="display: none;">

        <h1>Confirme seus dados</h1>

        <p>Seu cadastro está quase concluído.</p>

        <button type="button" id="finalizar">Não, está tudo errado</button>
        <button type="button" id="voltar">Sim, está tudo certo</button>

    </div>

    <div id="telaFinal" style="display: none;">

        <h1>Parabéns!</h1>

        <p>Você chegou ao final da pior experiência de usuário.</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
